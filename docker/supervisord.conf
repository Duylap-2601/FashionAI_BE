[supervisord]
nodaemon=true
logfile=/dev/fd/1
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:tailscaled]
command=/usr/local/bin/tailscaled --tun=userspace-networking --socket=/tmp/tailscale/tailscaled.sock --statedir=/tmp/tailscale/state
priority=10
autostart=true
autorestart=unexpected
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:db-proxy]
command=/app/docker/tailscale-db-proxy.sh
priority=20
autostart=true
autorestart=unexpected
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:redis-proxy]
command=/app/docker/tailscale-redis-proxy.sh
priority=25
autostart=true
autorestart=unexpected
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:app]
command=/app/docker/app-bootstrap.sh
priority=30
autostart=true
autorestart=false
startsecs=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[eventlistener:exit-listener]
command=/app/docker/supervisor-exit-listener.py
events=PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
buffer_size=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
